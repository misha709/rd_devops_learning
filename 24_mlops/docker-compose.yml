services:
  chatapi-gemini:
    build:
      context: ./ChatApi
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - ASPNETCORE_ENVIRONMENT=Production
      - AiProvider=Gemini
    restart: unless-stopped
    container_name: chatapi-gemini

  # Ollama service (Self-hosted model)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    container_name: ollama

  chatapi-ollama:
    build:
      context: ./ChatApi
      dockerfile: Dockerfile
    ports:
      - "8081:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - AiProvider=Ollama
      - Ollama__Url=http://ollama:11434
      - Ollama__Model=phi3
    depends_on:
      - ollama
    restart: unless-stopped
    container_name: chatapi-ollama

volumes:
  ollama_data:

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'monitoring-lab'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus-server'

  # Node Exporter on Web Server
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['WEB_SERVER_PRIVATE_IP:9100']
        labels:
          instance: 'web-server'
          role: 'web'

  # Nginx Exporter on Web Server
  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['WEB_SERVER_PRIVATE_IP:9113']
        labels:
          instance: 'web-server'
          service: 'nginx'

  # Optional: Monitor the monitoring server itself
  - job_name: 'monitoring-server'
    static_configs:
      - targets: ['MONITORING_SERVER_PRIVATE_IP:9100']
        labels:
          instance: 'monitoring-server'
          role: 'monitoring'
